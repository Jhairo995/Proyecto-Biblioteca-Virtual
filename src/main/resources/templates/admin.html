<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - CodeLibrary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-shield-lock-fill text-warning"></i> Panel Administrativo
        </a>
        <a th:href="@{/}" class="btn btn-outline-light btn-sm">Salir al Inicio</a>
    </div>
</nav>

<div class="container py-5">
    <div class="row g-4">
        <!-- Formulario de carga de títulos -->
        <div class="col-lg-5">
            <div class="card shadow-sm border-0 p-4 rounded-4">
                <h4 class="fw-bold mb-3"><i class="bi bi-cloud-upload"></i> Publicar Nuevo Libro</h4>
                <p class="text-muted small">Todos los campos de licencia son obligatorios para publicar[cite: 1].</p>
                
                <form>
                    <div class="mb-3">
                        <label class="form-label small">Título del libro</label>
                        <input type="text" class="form-control" required placeholder="Ej: Clean Code">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Idioma</label>
                        <input type="text" class="form-control" required placeholder="Español, Inglés...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Tipo de Licencia</label>
                        <select class="form-select" required>
                            <option value="Dominio Público">Dominio Público</option>
                            <option value="Licencia Abierta">Licencia Abierta (Creative Commons)</option>
                            <option value="Derechos Cedidos">Derechos Cedidos Expresamente</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Titular de Derechos / Fuente</label>
                        <input type="text" class="form-control" required placeholder="Nombre o entidad que cede">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Archivo del Libro (.EPUB)[cite: 1]</label>
                        <input type="file" class="form-control" accept=".epub" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Validar y Publicar Libro</button>
                </form>
            </div>
        </div>

        <!-- Métricas y catálogo rápido -->
        <div class="col-lg-7">
            <div class="row g-3 mb-4">
                <div class="col-sm-6">
                    <div class="card p-3 border-0 shadow-sm rounded-4 text-center">
                        <h6 class="text-muted">Usuarios Registrados</h6>
                        <h2 class="fw-bold text-primary">12</h2>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="card p-3 border-0 shadow-sm rounded-4 text-center">
                        <h6 class="text-muted">Libros en Catálogo</h6>
                        <h2 class="fw-bold text-success">5</h2>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0 p-4 rounded-4">
                <h5 class="fw-bold mb-3">Catálogo Actual</h5>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr class="table-light">
                                <th>Título</th>
                                <th>Licencia</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>JavaScript Moderno</td>
                                <td><span class="badge bg-success">Dominio Público</span></td>
                                <td><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></td>
                            </tr>
                            <tr>
                                <td>Python desde cero</td>
                                <td><span class="badge bg-info text-dark">Licencia Abierta</span></td>
                                <td><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
