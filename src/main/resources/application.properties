spring.application.name=CodeLibrary
server.port=8081

# ==============================================================================
# Configuración para conectar MySQL/MariaDB (XAMPP, Docker o Kubernetes)
# Las credenciales NO van en el código: se leen de variables de entorno.
#   DB_HOST      (por defecto: localhost)
#   DB_PORT      (por defecto: 3306; usa 3307 si tu XAMPP tiene MySQL en ese puerto)
#   DB_USER      (por defecto: root)
#   DB_PASSWORD  (por defecto: vacío, como XAMPP; defínela si tu BD tiene clave)
# En Docker/Kubernetes se sobrescriben con SPRING_DATASOURCE_USERNAME / _PASSWORD.
# ==============================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/biblioteca_virtual?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA e Hibernate (update: crea/actualiza las tablas a partir de las entidades)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Las vistas Thymeleaf leen relaciones LAZY (escritor, libro de la lista): se mantiene la sesión JPA abierta
spring.jpa.open-in-view=true

# Forzar el dialecto para evitar el error de metadata en XAMPP
# (dialecto propio: XAMPP trae MariaDB 10.4, que no soporta "ALTER TABLE IF EXISTS")
spring.jpa.database-platform=com.example.ejemplodemo.config.XamppMariaDBDialect

# Administrador inicial: se crea al arrancar si se define la variable de entorno ADMIN_PASSWORD
app.admin.correo=admin@codelibrary.com
app.admin.password=${ADMIN_PASSWORD:}

# Archivos PDF de los libros (carpeta relativa al proyecto, ignorada por git)
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# Permite responder con un mensaje cuando el PDF supera el límite (en vez de cortar la conexión)
server.tomcat.max-swallow-size=-1