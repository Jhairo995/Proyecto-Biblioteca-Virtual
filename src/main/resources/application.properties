spring.application.name=CodeLibrary
server.port=8081

# ==============================================================================
# Configuración para conectar MySQL/MariaDB de XAMPP
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_virtual?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA e Hibernate (update: crea/actualiza las tablas a partir de las entidades)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Forzar el dialecto para evitar el error de metadata en XAMPP
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Administrador inicial: se crea al arrancar si se define la variable de entorno ADMIN_PASSWORD
app.admin.correo=admin@codelibrary.com
app.admin.password=${ADMIN_PASSWORD:}

# Archivos PDF de los libros (carpeta relativa al proyecto, ignorada por git)
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB