<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Biblioteca Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">

<div class="card shadow-lg p-4" style="max-width: 420px; width: 100%; border-radius: 15px;">
    <div class="text-center mb-4">
        <a th:href="@{/}" class="text-decoration-none">
            <h3 class="text-primary fw-bold"><i class="bi bi-code-slash"></i> CodeLibrary</h3>
        </a>
        <p class="text-muted small">Ingresa tus credenciales para continuar</p>
    </div>

    <!-- Pestañas Login / Registro -->
    <ul class="nav nav-pills nav-fill mb-3" id="authTabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-panel" type="button">Ingresar</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-panel" type="button">Registrarse</button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- Formulario Iniciar Sesión -->
        <div class="tab-pane fade show active" id="login-panel">
            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label small">Correo electrónico</label>
                    <input type="email" class="form-control" id="loginCorreo" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Contraseña</label>
                    <input type="password" class="form-control" id="loginPass" required>
                </div>
                <button type="button" onclick="iniciarSesion()" class="btn btn-primary w-100 mt-2">Iniciar sesión</button>
            </form>
        </div>

        <!-- Formulario Registro -->
        <div class="tab-pane fade" id="register-panel">
            <form id="formRegistro">
                <div class="mb-3">
                    <label class="form-label small">Nombre completo</label>
                    <input type="text" class="form-control" id="regNombre" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Correo electrónico</label>
                    <input type="email" class="form-control" id="regCorreo" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Contraseña</label>
                    <input type="password" class="form-control" id="regPass" required>
                </div>
                <button type="button" onclick="registrarUsuario()" class="btn btn-success w-100 mt-2">Crear Cuenta</button>
            </form>
        </div>
    </div>
    <div id="alerta" class="mt-3 text-center small fw-bold"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function registrarUsuario() {
        const nombre = document.getElementById('regNombre').value;
        const correo = document.getElementById('regCorreo').value;
        const contrasena = document.getElementById('regPass').value;
        const alerta = document.getElementById('alerta');

        try {
            const res = await fetch('/api/auth/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, correo, contrasena })
            });
            const data = await res.json();
            if (res.ok) {
                alerta.className = 'mt-3 text-center small fw-bold text-success';
                alerta.innerText = 'Usuario registrado con éxito. Ya puedes iniciar sesión.';
                document.getElementById('formRegistro').reset();
            } else {
                alerta.className = 'mt-3 text-center small fw-bold text-danger';
                alerta.innerText = data.error || 'Error al registrar';
            }
        } catch (e) {
            alerta.innerText = 'Error de conexión con el servidor.';
        }
    }

    function iniciarSesion() {
        // Redirección directa al panel administrativo para probar flujo visual
        window.location.href = '/admin';
    }
</script>
</body>
</html>
