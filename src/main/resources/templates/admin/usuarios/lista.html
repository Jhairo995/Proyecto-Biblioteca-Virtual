<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('Usuarios')}"></head>

<body class="admin-body">
<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('usuarios')}"></aside>

    <main class="admin-main">
        <header th:replace="~{fragments/admin :: topbar('Usuarios', 'Consulta, crea y administra las cuentas de la plataforma.')}"></header>

        <div class="admin-content">
            <div th:replace="~{fragments/admin :: alertas}"></div>

            <div class="admin-page-head">
                <p class="mb-0 text-muted" th:text="|${pagina.totalElements} usuario(s) encontrado(s)|">0 usuarios</p>
                <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary"><i class="bi bi-person-plus"></i> Nuevo usuario</a>
            </div>

            <section class="admin-card">
                <form id="filtros" class="admin-toolbar border-bottom" th:action="@{/admin/usuarios}" method="get" role="search" data-autoenvio>
                    <div class="input-icon flex-grow-1">
                        <i class="bi bi-search"></i>
                        <input type="search" name="q" class="form-control" th:value="${q}" maxlength="100"
                               placeholder="Buscar por nombre, correo o DNI" aria-label="Buscar usuarios">
                    </div>
                    <select name="rol" class="form-select" aria-label="Filtrar por rol">
                        <option value="">Todos los roles</option>
                        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}" th:selected="${r.id == rolFiltro}">Rol</option>
                    </select>
                    <select name="estado" class="form-select" aria-label="Filtrar por estado">
                        <option value="">Todos los estados</option>
                        <option value="activos" th:selected="${estadoFiltro == 'activos'}">Activos</option>
                        <option value="inactivos" th:selected="${estadoFiltro == 'inactivos'}">Inactivos</option>
                    </select>
                    <button type="submit" class="btn btn-outline-primary"><i class="bi bi-funnel"></i> Filtrar</button>
                    <a th:if="${q != null or rolFiltro != null or estadoFiltro != null}" th:href="@{/admin/usuarios}" class="btn btn-light">Limpiar</a>
                </form>

                <div th:if="${pagina.empty}" class="empty-state">
                    <i class="bi bi-person-x"></i>
                    No se encontraron usuarios con esos filtros.
                </div>

                <div th:unless="${pagina.empty}" class="table-responsive">
                    <table class="table admin-table align-middle">
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>DNI</th>
                                <th>Rol</th>
                                <th>Plan</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${pagina.content}" th:with="esPropio=${usuarioActual != null and u.id == usuarioActual.id}">
                                <td>
                                    <a class="cell-main" th:href="@{/admin/usuarios/{id}(id=${u.id})}">
                                        <span class="avatar" th:text="${u.iniciales}">AB</span>
                                        <span>
                                            <strong>
                                                <span th:text="${u.nombre}">Nombre</span>
                                                <span th:if="${esPropio}" class="badge-sistema ms-1">Tú</span>
                                            </strong>
                                            <small th:text="${u.correo}">correo@ejemplo.com</small>
                                        </span>
                                    </a>
                                </td>
                                <td class="font-monospace" th:text="${u.dni}">12345678</td>
                                <td>
                                    <span class="acceso-badge" th:classappend="${'acceso-' + #strings.toLowerCase(u.acceso.name())}"
                                          th:text="${u.rol?.nombre ?: 'Sin rol'}">Lector</span>
                                </td>
                                <td>
                                    <span th:if="${u.nivelCuenta.name() == 'PREMIUM'}" class="badge rounded-pill text-bg-warning"><i class="bi bi-stars"></i> Premium</span>
                                    <span th:unless="${u.nivelCuenta.name() == 'PREMIUM'}" class="text-muted small">Gratuito</span>
                                </td>
                                <td>
                                    <span class="estado-badge" th:classappend="${u.activo} ? 'estado-activo' : 'estado-inactivo'"
                                          th:text="${u.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                                </td>
                                <td class="text-end">
                                    <div class="acciones">
                                        <a th:href="@{/admin/usuarios/{id}(id=${u.id})}" class="btn btn-icon btn-light" title="Ver detalle" aria-label="Ver detalle">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}" class="btn btn-icon btn-outline-primary" title="Editar" aria-label="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:unless="${esPropio}" th:action="@{/admin/usuarios/{id}/estado(id=${u.id})}" method="post">
                                            <button type="submit" class="btn btn-icon btn-outline-secondary"
                                                    th:title="${u.activo} ? 'Desactivar cuenta' : 'Activar cuenta'"
                                                    th:aria-label="${u.activo} ? 'Desactivar cuenta' : 'Activar cuenta'">
                                                <i class="bi" th:classappend="${u.activo} ? 'bi-pause-circle' : 'bi-play-circle'"></i>
                                            </button>
                                        </form>
                                        <button th:unless="${esPropio}" type="button" class="btn btn-icon btn-outline-danger"
                                                data-bs-toggle="modal" data-bs-target="#modalEliminar" title="Eliminar" aria-label="Eliminar"
                                                th:attr="data-accion=@{/admin/usuarios/{id}/eliminar(id=${u.id})},data-nombre=${u.nombre},data-detalle='Se eliminará la cuenta y su lista de lectura. Si es autor de libros, desactívala en su lugar.'">
                                            <i class="bi bi-trash3"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <nav th:replace="~{fragments/admin :: paginacion(${pagina})}"></nav>
            </section>
        </div>
    </main>
</div>

<div th:replace="~{fragments/admin :: modalEliminar}"></div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
