<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catálogo')}"></head>

<body>
<nav th:replace="~{fragments/layout :: navbar('catalogo')}"></nav>

<section class="page-hero">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <div class="container">
        <span class="hero-badge mb-3"><i class="bi bi-collection"></i> Biblioteca</span>
        <h1 class="fw-bold display-5">Explora el <span class="text-gradient">catálogo completo</span></h1>
        <p class="lead mb-0">Todos nuestros libros de programación en un solo lugar.</p>
    </div>
</section>

<section id="libros" class="py-5">
    <div class="container py-4">
        <!-- Libros publicados por los escritores y aprobados por el administrador -->
        <div th:unless="${#lists.isEmpty(libros)}" class="row g-4">
            <th:block th:each="libro : ${libros}">
                <div th:replace="~{fragments/layout :: libroPublicado(${libro})}"></div>
            </th:block>
        </div>

        <!-- Muestras mientras no haya libros publicados -->
        <p th:if="${#lists.isEmpty(libros)}" class="text-muted text-center mb-4">
            Aún no hay libros publicados por nuestros escritores. Mientras tanto, mira algunas muestras:
        </p>
        <div th:if="${#lists.isEmpty(libros)}" class="row g-4">
            <div th:replace="~{fragments/layout :: libro('JavaScript Moderno', 'JavaScript', 'Aprende JavaScript desde cero hasta conceptos avanzados.', 'cover-blue', '4.9')}"></div>
            <div th:replace="~{fragments/layout :: libro('Python desde cero', 'Python', 'Aprende los fundamentos de Python mediante ejemplos prácticos.', 'cover-green', '4.8')}"></div>
            <div th:replace="~{fragments/layout :: libro('SQL Profesional', 'Bases de datos', 'Consultas, relaciones, índices y optimización.', 'cover-dark', '4.7')}"></div>
            <div th:replace="~{fragments/layout :: libro('React para desarrolladores', 'React', 'Componentes, hooks, estados y aplicaciones modernas.', 'cover-orange', '4.9')}"></div>
            <div th:replace="~{fragments/layout :: libro('Spring Boot en acción', 'Java', 'Crea APIs REST y aplicaciones web con Spring Boot.', 'cover-cyan', '4.8')}"></div>
            <div th:replace="~{fragments/layout :: libro('Machine Learning práctico', 'IA', 'Modelos, datos y entrenamiento con Python.', 'cover-pink', '4.7')}"></div>
            <div th:replace="~{fragments/layout :: libro('Git y GitHub', 'Herramientas', 'Control de versiones, ramas y trabajo en equipo.', 'cover-dark', '4.9')}"></div>
            <div th:replace="~{fragments/layout :: libro('Node.js a fondo', 'JavaScript', 'Servidores, APIs y aplicaciones en tiempo real.', 'cover-green', '4.6')}"></div>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
