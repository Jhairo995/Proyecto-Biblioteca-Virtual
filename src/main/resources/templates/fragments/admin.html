<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Fragmentos del panel de administración: menú lateral, barra superior, alertas, errores, paginación y confirmación -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' · Administración - CodeLibrary'">Administración - CodeLibrary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<!-- Menú lateral: fijo en escritorio, panel deslizable en móvil -->
<aside th:fragment="sidebar(activo)" class="admin-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="adminSidebar"
       aria-label="Menú de administración">
    <div class="admin-sidebar-inner">
        <div class="admin-brand-row">
            <a class="admin-brand" th:href="@{/admin}">
                <span class="admin-brand-mark"><i class="bi bi-code-slash"></i></span>
                <span class="admin-brand-text">CodeLibrary<small>Administración</small></span>
            </a>
            <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
                    data-bs-target="#adminSidebar" aria-label="Cerrar menú"></button>
        </div>

        <nav class="admin-nav">
            <span class="admin-nav-label">General</span>
            <a th:replace="~{fragments/admin :: navItem('panel', ${activo}, '/admin', 'bi-grid-1x2', 'Panel general')}"></a>

            <span class="admin-nav-label">Catálogo</span>
            <a class="admin-nav-link" th:href="@{/admin/libros}" th:classappend="${activo == 'libros'} ? 'active'"
               th:attr="aria-current=${activo == 'libros' ? 'page' : null}">
                <i class="bi bi-journal-bookmark"></i><span>Libros</span>
                <span th:if="${pendientesMenu != null and pendientesMenu > 0}" class="admin-nav-badge"
                      th:text="${pendientesMenu}" th:title="${pendientesMenu + ' por revisar'}">0</span>
            </a>
            <a th:replace="~{fragments/admin :: navItem('categorias', ${activo}, '/admin/categorias', 'bi-tags', 'Categorías')}"></a>

            <span class="admin-nav-label">Personas</span>
            <a th:replace="~{fragments/admin :: navItem('usuarios', ${activo}, '/admin/usuarios', 'bi-people', 'Usuarios')}"></a>
            <a th:replace="~{fragments/admin :: navItem('roles', ${activo}, '/admin/roles', 'bi-shield-check', 'Roles')}"></a>

            <span class="admin-nav-label">Sitio</span>
            <a class="admin-nav-link" th:href="@{/}"><i class="bi bi-house"></i><span>Ver sitio público</span></a>
        </nav>

        <div class="admin-user" th:if="${usuarioActual != null}">
            <span class="avatar" th:text="${usuarioActual.iniciales}">AD</span>
            <div class="admin-user-info">
                <strong th:text="${usuarioActual.nombre}">Administrador</strong>
                <small th:text="${usuarioActual.rol?.nombre}">Administrador</small>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-icon admin-logout" title="Cerrar sesión" aria-label="Cerrar sesión">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>
</aside>

<a th:fragment="navItem(clave, activo, url, icono, texto)" class="admin-nav-link" th:href="@{${url}}"
   th:classappend="${activo == clave} ? 'active'" th:attr="aria-current=${activo == clave ? 'page' : null}">
    <i class="bi" th:classappend="${icono}"></i><span th:text="${texto}">Texto</span>
</a>

<header th:fragment="topbar(titulo, subtitulo)" class="admin-topbar">
    <button class="btn btn-light btn-icon d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminSidebar"
            aria-controls="adminSidebar" aria-label="Abrir menú">
        <i class="bi bi-list fs-5"></i>
    </button>
    <div class="min-w-0">
        <h1 class="admin-title" th:text="${titulo}">Título</h1>
        <p class="admin-subtitle" th:if="${subtitulo != null}" th:text="${subtitulo}">Subtítulo</p>
    </div>
</header>

<div th:fragment="alertas">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show admin-alert" role="status">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${exito}">Operación realizada.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show admin-alert" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${error}">Ocurrió un error.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

<!-- Errores generales del formulario (reglas que no pertenecen a un solo campo). Usar dentro de th:object -->
<div th:fragment="erroresGenerales" th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger admin-alert" role="alert">
    <i class="bi bi-exclamation-octagon-fill"></i>
    <div>
        <div th:each="mensaje : ${#fields.globalErrors()}" th:text="${mensaje}">Error</div>
    </div>
</div>

<!-- Mensaje de un campo: el error del servidor si existe, o la ayuda para la validación del navegador -->
<div th:fragment="feedback(campo, ayuda)" class="invalid-feedback"
     th:text="${#fields.hasErrors(campo)} ? ${#strings.listJoin(#fields.errors(campo), ' ')} : ${ayuda}">Ayuda</div>

<!-- Paginación: los botones envían el formulario de filtros (id="filtros") con el número de página -->
<nav th:fragment="paginacion(pagina)" th:if="${pagina.totalPages > 1}" class="admin-pagination" aria-label="Paginación">
    <span class="text-muted small"
          th:text="|Página ${pagina.number + 1} de ${pagina.totalPages} · ${pagina.totalElements} resultados|">Página 1 de 1</span>
    <div class="d-flex flex-wrap gap-1">
        <button type="submit" form="filtros" name="page" class="btn btn-sm btn-outline-secondary"
                th:value="${pagina.number - 1}" th:disabled="${pagina.first}" aria-label="Página anterior">
            <i class="bi bi-chevron-left"></i>
        </button>
        <th:block th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}">
            <button th:if="${i == 0 or i == pagina.totalPages - 1 or (i >= pagina.number - 2 and i <= pagina.number + 2)}"
                    type="submit" form="filtros" name="page" class="btn btn-sm"
                    th:classappend="${i == pagina.number} ? 'btn-primary' : 'btn-outline-secondary'"
                    th:value="${i}" th:text="${i + 1}" th:attr="aria-current=${i == pagina.number ? 'page' : null}">1</button>
        </th:block>
        <button type="submit" form="filtros" name="page" class="btn btn-sm btn-outline-secondary"
                th:value="${pagina.number + 1}" th:disabled="${pagina.last}" aria-label="Página siguiente">
            <i class="bi bi-chevron-right"></i>
        </button>
    </div>
</nav>

<!-- Confirmación de eliminación: admin.js completa la acción y el nombre desde el botón que la abre -->
<div th:fragment="modalEliminar" class="modal fade" id="modalEliminar" tabindex="-1" aria-labelledby="modalEliminarTitulo"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content admin-modal" method="post" action="#">
            <div class="modal-body text-center p-4">
                <span class="modal-icon"><i class="bi bi-trash3"></i></span>
                <h2 class="h5 fw-bold mt-3" id="modalEliminarTitulo">¿Eliminar «<span data-modal-nombre>este registro</span>»?</h2>
                <p class="text-muted mb-0" data-modal-detalle>Esta acción no se puede deshacer.</p>
            </div>
            <div class="modal-footer border-0 justify-content-center pb-4 pt-0">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-danger"><i class="bi bi-trash3"></i> Sí, eliminar</button>
            </div>
        </form>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin.js}"></script>
</th:block>

</body>
</html>
