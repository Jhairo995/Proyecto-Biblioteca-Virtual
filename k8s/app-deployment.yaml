apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: biblioteca
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biblioteca-app
  namespace: biblioteca
spec:
  # 1 réplica: los PDF se guardan en un volumen ReadWriteOnce (ver docs/08-devops.md)
  replicas: 1
  selector:
    matchLabels:
      app: biblioteca-app
  template:
    metadata:
      labels:
        app: biblioteca-app
    spec:
      containers:
        - name: biblioteca-app
          image: IMAGEN_APP        # el pipeline reemplaza este valor (ej. usuario/biblioteca-virtual:12)
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mariadb:3306/biblioteca_virtual?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biblioteca-secretos
                  key: DB_PASSWORD
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biblioteca-secretos
                  key: ADMIN_PASSWORD
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /login
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
