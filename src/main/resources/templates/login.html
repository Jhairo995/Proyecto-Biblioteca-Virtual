<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Acceso')}"></head>

<body class="auth-page d-flex align-items-center justify-content-center p-3">
<span class="blob blob-1"></span>
<span class="blob blob-2"></span>
<span class="blob blob-3"></span>

<div class="card auth-card p-4 p-md-5">
    <div class="text-center mb-4">
        <a th:href="@{/}" class="text-decoration-none">
            <h3 class="fw-bold text-dark"><i class="bi bi-code-slash text-primary"></i> CodeLibrary</h3>
        </a>
        <p class="text-muted small">Ingresa tus credenciales para continuar</p>
    </div>

    <!-- Pestañas Login / Registro -->
    <ul class="nav nav-pills nav-fill mb-4 bg-light rounded-pill p-1" id="authTabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-panel" type="button">Ingresar</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-panel" type="button">Registrarse</button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- Formulario Iniciar Sesión -->
        <div class="tab-pane fade show active" id="login-panel">
            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="loginCorreo">Correo electrónico</label>
                    <input type="email" class="form-control" id="loginCorreo" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="loginPass">Contraseña</label>
                    <input type="password" class="form-control" id="loginPass" required>
                </div>
                <button type="button" onclick="iniciarSesion()" class="btn btn-primary w-100 mt-2">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                </button>
            </form>
        </div>

        <!-- Formulario Registro -->
        <div class="tab-pane fade" id="register-panel">
            <form id="formRegistro">
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="regNombre">Nombre completo</label>
                    <input type="text" class="form-control" id="regNombre" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="regDni">DNI</label>
                    <input type="text" class="form-control" id="regDni" inputmode="numeric"
                           pattern="\d{8}" maxlength="8" placeholder="8 dígitos" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="regCorreo">Correo electrónico</label>
                    <input type="email" class="form-control" id="regCorreo" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="regPass">Contraseña</label>
                    <input type="password" class="form-control" id="regPass" minlength="6" required>
                </div>
                <button type="button" onclick="registrarUsuario()" class="btn btn-primary w-100 mt-2">
                    <i class="bi bi-person-plus"></i> Crear cuenta
                </button>
            </form>
        </div>
    </div>
    <div id="alerta" class="mt-3 text-center small fw-bold"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function mostrarAlerta(mensaje, tipo) {
        const alerta = document.getElementById('alerta');
        alerta.className = `mt-3 text-center small fw-bold text-${tipo}`;
        alerta.innerText = mensaje;
    }

    async function registrarUsuario() {
        const form = document.getElementById('formRegistro');
        if (!form.reportValidity()) {
            return;
        }

        const nombre = document.getElementById('regNombre').value.trim();
        const dni = document.getElementById('regDni').value.trim();
        const correo = document.getElementById('regCorreo').value.trim();
        const contrasena = document.getElementById('regPass').value;

        try {
            const res = await fetch('/api/auth/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, dni, correo, contrasena })
            });
            const data = await res.json();
            if (res.ok) {
                mostrarAlerta('Usuario registrado con éxito. Ya puedes iniciar sesión.', 'success');
                form.reset();
            } else {
                mostrarAlerta(data.error || 'Error al registrar', 'danger');
            }
        } catch (e) {
            mostrarAlerta('Error de conexión con el servidor.', 'danger');
        }
    }

    function iniciarSesion() {
        // Redirección directa al panel administrativo para probar flujo visual
        window.location.href = '/admin';
    }
</script>
</body>
</html>
