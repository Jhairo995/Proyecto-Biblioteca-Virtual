spring.application.name=CodeLibrary
server.port=8081

# ==============================================================================
# Configuración para conectar MySQL/MariaDB de XAMPP
# ==============================================================================
# createDatabaseIfNotExist: al clonar el proyecto no hace falta crear la BD a mano
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_virtual?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA e Hibernate (update: crea/actualiza las tablas a partir de las entidades)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MySQLDialect sirve para MySQL 8 y para el MariaDB 10.4 de XAMPP. MariaDBDialect exige MariaDB 10.6+:
# en XAMPP no llegaba a crear las claves UNIQUE (correo, DNI) ni las foráneas.
# Fijarlo además evita el error "Unable to determine Dialect" cuando la contraseña de la BD es incorrecta.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Administrador inicial: se crea al arrancar si se define la variable de entorno ADMIN_PASSWORD
# (su correo y DNI quedan reservados: nadie más puede registrarse con ellos)
app.admin.correo=admin@codelibrary.com
app.admin.dni=00000000
app.admin.password=${ADMIN_PASSWORD:}

# Archivos PDF de los libros (carpeta relativa al proyecto, ignorada por git)
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB