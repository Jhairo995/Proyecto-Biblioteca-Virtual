<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Leyendo')}"></head>

<body>
<nav th:replace="~{fragments/layout :: navbar('panel')}"></nav>

<div class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
        <div>
            <span class="badge badge-soft" th:text="${libro.categoria}">Categoría</span>
            <h1 class="h3 fw-bold mt-2 mb-0" th:text="${libro.titulo}">Título</h1>
            <small class="text-muted" th:if="${libro.escritor != null}">
                <i class="bi bi-pen"></i> <span th:text="${libro.escritor.nombre}">Escritor</span>
            </small>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/lector/libros/{id}/archivo(id=${libro.id})}" target="_blank" class="btn btn-outline-primary">
                <i class="bi bi-box-arrow-up-right"></i> Pantalla completa
            </a>
            <a th:href="@{/lector}" class="btn btn-primary"><i class="bi bi-arrow-left"></i> Mi biblioteca</a>
        </div>
    </div>

    <div class="card panel-card overflow-hidden">
        <iframe th:src="@{/lector/libros/{id}/archivo(id=${libro.id})}" title="Lector de PDF"
                class="w-100 border-0" style="height: 80vh;"></iframe>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
